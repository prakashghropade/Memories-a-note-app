name: Frontend CI

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Enter docker image tag"
        required: true
        default: ""
        type: string
      
      backend_url:
        description: "Enter the  backend url"
        required: true
        default: ""
        type: string
env:
  IMAGE_NAME: prakashghorpade2001/memories-notes-app-frontend:${{ inputs.image_tag }}

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Build frontend Image
        run: |
          docker build \
              --build-arg REACT_APP_API_URL=${{ inputs.backend_url }} \
          -t ${{ env.IMAGE_NAME }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Push Frontend Image
        run: |
          docker push \
          ${{ env.IMAGE_NAME }}





    