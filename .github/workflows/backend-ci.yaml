name: Backend CI

on:
  workflow_dispatch:
    inputs:
      image_tag: 
        description: "Enter docker image tag"
        required: true
        default: ""
        type: string
      
env:
  IMAGE_NAME: prakashghorpade2001/memories-notes-app-backend:${{ inputs.image_tag }}

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Build backend Image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }} .
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Push Frontend Image
        run: |
          docker push \
          ${{ env.IMAGE_NAME }}
