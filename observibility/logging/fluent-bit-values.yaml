service:
  flush: 1
  logLevel: info
  metricsPort: 2020

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf

        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Tag               kube.*
        multiline.parser  docker, cri

        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10
        Rotate_Wait       30
        DB                /var/log/flb_kubernetes.db
        DB.Sync           Normal

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*

        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token

        Merge_Log           On
        Keep_Log            On

        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

        Labels              On
        Annotations         On

  outputs: |
    [OUTPUT]
        Name                es
        Match               kube.*

        Host                elasticsearch-master
        Port                9200

        HTTP_User           elastic
        HTTP_Passwd         IWmkQsP1YzqRFvO5

        tls                 On
        tls.verify          Off

        Logstash_Format     On
        Logstash_Prefix     logstash

        Suppress_Type_Name  On

        Retry_Limit         False