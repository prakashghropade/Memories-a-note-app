version: "3.8"

services:

  memories-website:
    build:
      context: .
      dockerfile: Dockerfile.production
    ports:
      - "3000:80"
    env_file:
      - .env.production
    restart: unless-stopped
    container_name: memories_website

  memories_website_dev:
    build:
      context: .
      dockerfile: Dockerfile.development
    ports:
      - "3002:3000"
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    container_name: memories_website_dev

