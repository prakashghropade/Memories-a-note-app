apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: memories-notes-app-project
  namespace: argocd
spec:
  description: Project for the Memories Notes App
  sourceRepos:
    - https://github.com/prakashghropade/Memories-a-note-app.git
  destinations:
    - namespace: memories-notes-app-namespace
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: logging
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: tracing
      server: https://kubernetes.default.svc
    - namespace: memories-notes-dev
      server: https://kubernetes.default.svc
    - namespace: memories-notes-prod
      server: https://kubernetes.default.svc
    - namespace: memories-notes-stag
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: admin
      description: Admin role with full access
      policies:
        - p, proj:memories-notes-app-project:admin, applications, *, memories-notes-app-namespace/*, allow
        - p, proj:memories-notes-app-project:admin, clusters, *, *, allow
        - p, proj:memories-notes-app-project:admin, repositories, *, *, allow
  
  
