apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd

data:
  context: |
    argocdUrl: https://3.110.127.130:30003

  service.email: |
    username: $email-username
    password: $email-password
    host: $email-host
    port: 465
    from: $email-username

  template.email-health-degraded: |
    email:
      subject: "[ArgoCD] {{.app.metadata.name}} health is {{.app.status.health.status}}"
    message: |
      Application: {{.app.metadata.name}}
      Namespace: {{.app.metadata.namespace}}
      Sync status: {{.app.status.sync.status}}
      Revision: {{.app.status.sync.revision}}
      Health status: {{.app.status.health.status}}
      Health message: {{.app.status.health.message}}
      Last operation: {{if .app.status.operationState}}{{.app.status.operationState.phase}}{{end}}
      Details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  template.email-application-deployed: |
    email:
      subject: "[ArgoCD] {{.app.metadata.name}} successfully deployed"
    message: |
      Application: {{.app.metadata.name}}
      Namespace: {{.app.metadata.namespace}}
      Sync status: {{.app.status.sync.status}}
      Revision: {{.app.status.sync.revision}}
      Health status: {{.app.status.health.status}}
      Last operation: {{if .app.status.operationState}}{{.app.status.operationState.phase}}{{end}}
      Finished at: {{if .app.status.operationState}}{{.app.status.operationState.finishedAt}}{{end}}
      Details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  trigger.on-deployed: |
    - when: app.status.operationState != nil and app.status.operationState.phase == 'Succeeded' and app.status.health.status == 'Healthy'
      send:
        - email-application-deployed

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send:
        - email-health-degraded

  trigger.on-sync-succeeded: |
    - when: app.status.operationState != nil and app.status.operationState.phase == 'Succeeded'
      send:
      - email-application-deployed
