apiVersion:  argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-logging-app
  namespace: argocd
  
spec:
  project: memories-notes-app-project
  source:
    repoURL: https://github.com/prakashghropade/Memories-a-note-app.git
    targetRevision: main
    path: observibility/logging/base
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      