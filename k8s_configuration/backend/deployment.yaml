kind: Deployment
apiVersion: apps/v1
metadata:
  name: backnd-deployment
  namespace: memories-notes-app-namespace
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: prakashghorpade2001/memories-notes-app-backend:v1.0.2
        ports:
        - containerPort: 3001
 
        envFrom:
        - configMapRef:
            name: backend-config

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

