kind: Deployment
apiVersion: apps/v1
metadata:
  name: frontend-deployment
  namespace: memories-notes-app-namespace
  labels:
    app: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q --spider http://backend-service:3001/ ; do
              echo "Waiting for Backend..."
              sleep 5
              done
              echo "Backend is ready!"

      containers:
      - name: frontend
        image: prakashghorpade2001/memories-notes-app-frontend:v1.0.16
        ports:
        - containerPort: 3000

        envFrom:
        - configMapRef:
            name: frontend-config

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        startupProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        