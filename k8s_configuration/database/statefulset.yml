kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: mongodb-statefulset
  namespace: memories-notes-app-namespace

spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  serviceName: "mongodb-service"
  template:
    metadata:
      labels:
        app: mongodb
    spec:
    containers:
    - name: mongodb-container
      image: 
      ports:
          - containerPort: 27017
        
      env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-secrete
              key: username
        
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secrete
              key: password

      volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db
        
    volumes:
      - name: mongodb-storage
        persistentVolumeClaim:
          claimName: mongodb-pvc
  