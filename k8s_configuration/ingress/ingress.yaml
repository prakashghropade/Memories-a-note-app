apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memoris-notes-ingress
  namespace: memories-notes-app-namespace
=
spec:
  ingressClassName: nginx

  rules:
    - host: prakashghorpade.shop
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3001
        
    - host: api.prakashghorpade.shop
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:  
            service:
              name: fontend-service
              port:
                number: 3000
          